name: Refresh Kalshi market cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-kalshi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch public Kalshi markets
        run: node scripts/fetch-kalshi.mjs
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- data/kalshi-markets.json; then
            echo "Snapshot is unchanged"
            exit 0
          fi
          git config user.name "market-mirror-bot"
          git config user.email "market-mirror-bot@users.noreply.github.com"
          git add data/kalshi-markets.json
          git commit -m "Refresh Kalshi market snapshot"
          git push
